<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KOA Severity Predictor</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #dfe9f3, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        input[type="file"] {
            margin: 20px auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
            width: 100%;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease, transform 0.2s;
        }

        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f4f8fb;
            color: #34495e;
            font-weight: bold;
            font-size: 16px;
            display: none; /* Will be shown dynamically */
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KOA Severity Predictor</h1>
        <form action="/predict" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit">Predict</button>
        </form>

        <div id="result" class="result">
            <!-- Result will appear here -->
        </div>

        <footer>
            <p>Upload a knee X-ray image to detect the severity level of osteoarthritis.</p>
        </footer>
    </div>

    <script>
        // Optional: Example of dynamically displaying a result
        // This could be filled via JavaScript after form submission (AJAX or update via Flask route)
        /*
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerText = "🟡 Grade 2 - Mild Osteoarthritis";
        */
    </script>
</body>
</html>
